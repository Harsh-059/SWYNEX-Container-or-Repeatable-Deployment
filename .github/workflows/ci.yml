name: SWYNEX CI Pipeline

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Bash Syntax Check and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: |
          bash -n app.sh
          bash -n test.sh

      - name: Run application
        run: bash app.sh

      - name: Run automated tests
        run: bash test.sh
